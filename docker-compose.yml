# 全栈一键编排：MySQL + Redis + 迁移 + API（前端打包进 API 镜像，由 Go 服务统一托管）。
#
# 启动： docker compose up -d
#   依赖顺序由 depends_on 保证：
#     mysql 就绪(健康检查通过) → migrate 执行表结构+种子(幂等) → api 启动并托管前端 SPA(:${API_PORT})
# 停止（保留数据）： docker compose down
# 停止（清空数据）： docker compose down -v
#
# 配置集中在 .env（开发默认值见 .env.example）：
#   - 改密码/库名：改 MYSQL_ROOT_PASSWORD / MYSQL_DATABASE，并同步改 MYSQL_DSN 中对应部分
#   - 容器内服务间连接（MYSQL_DSN 的 mysql:3306、REDIS_HOST 的 redis:6379）使用 compose 服务名，一般无需改
#   - 各服务端口（API_PORT / REDIS_PORT）可改；MYSQL 默认不映射宿主机端口以免与本地 MySQL(3306) 冲突，
#     如需从宿主机直连，取消下方 mysql.ports 注释并设 MYSQL_PORT 对应值（如 3307）
#
# 未提供 .env 时，下方 ${VAR:-默认值} 自动生效，开箱即用。

services:
  mysql:
    image: mysql:8.0
    container_name: meteor-cms-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-go_meteor_cms}
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"   # 取消注释可从宿主机访问；若本地已占 3306 请改用 3307
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: meteor-cms-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 迁移：复用 api 服务构建出的同一镜像，仅替换启动命令为 /app/migrate。
  # 这里刻意不重复声明 build：两个服务同时构建同一个 tag 时，
  # `up -d --build` 会并发 naming 同一镜像并报 "image ... already exists"。
  migrate:
    image: ${CMS_IMAGE:-meteor-cms:local}
    container_name: meteor-cms-migrate
    command: ["/app/migrate"]
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/go_meteor_cms?parseTime=True&loc=Local}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # API：同一镜像默认 CMD 为 /app/cms -f etc/cms-api.yaml；前端由 WEB_DIST 托管
  api:
    image: ${CMS_IMAGE:-meteor-cms:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: meteor-cms-api
    ports:
      - "${API_PORT:-8888}:8888"
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-root:123456@tcp(mysql:3306)/go_meteor_cms?parseTime=True&loc=Local}
      REDIS_HOST: ${REDIS_HOST:-redis:6379}
      WEB_DIST: ${WEB_DIST:-/app/web/dist}
      # 登录验证码：生产环境保持 true；仅本地开发 / 自动化 E2E 设为 false
      LOGIN_CAPTCHA_ENABLED: ${LOGIN_CAPTCHA_ENABLED:-true}
      # 登录防爆破限流：生产保持 true；完整 E2E 套件可用 LOGIN_RATE_LIMIT_ENABLED=false 关闭
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      # 免鉴权 /api/ 接口限流（防刷）
      PUBLIC_RATE_LIMIT_ENABLED: ${PUBLIC_RATE_LIMIT_ENABLED:-true}
      PUBLIC_RATE_LIMIT_MAX: ${PUBLIC_RATE_LIMIT_MAX:-60}
      PUBLIC_RATE_LIMIT_WINDOW: ${PUBLIC_RATE_LIMIT_WINDOW:-60}
      PUBLIC_RATE_LIMIT_BLOCK: ${PUBLIC_RATE_LIMIT_BLOCK:-60}
      # 公开评论提交的独立配额（feature_comment_enabled=true 时生效）
      PUBLIC_COMMENT_RATE_MAX: ${PUBLIC_COMMENT_RATE_MAX:-5}
      PUBLIC_COMMENT_RATE_WINDOW: ${PUBLIC_COMMENT_RATE_WINDOW:-60}
      # JWT 密钥：生产必须通过 .env 注入；留空时沿用镜像内 etc/cms-api.yaml 的示例值，
      # 启动会输出安全告警，设 STRICT_SECURITY=true 则直接拒绝启动。
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:-}
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:-}
      STRICT_SECURITY: ${STRICT_SECURITY:-false}
      # 其它可覆盖项（留空 = 沿用配置文件默认值）
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      SQL_DEBUG: ${SQL_DEBUG:-}
      SCHEMA_CHECK_STRICT: ${SCHEMA_CHECK_STRICT:-}
      # Prometheus 抓取端点：默认关闭；开启时建议同时配置 METRICS_TOKEN
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-}
      MAINTENANCE_AUDIT_RETENTION_DAYS: ${MAINTENANCE_AUDIT_RETENTION_DAYS:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
    # 显式固定卷名：compose 项目名默认取自仓库目录名，日后把目录改成 meteor-cms
    # 或迁移到新机器时仍会复用同一份数据，避免「部署成功但库是空的」。
    # 这是唯一保留旧名 go_meteor_cms 前缀的内部标识符，改名等同于丢数据。
    name: go-meteor-cms_mysql_data
